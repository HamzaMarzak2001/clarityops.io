<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><title>DRIVE LINE — look dev</title>
<style>
  html,body{margin:0;height:100%;background:#060607;color:#f2f3f4;
    font:12px ui-monospace,Menlo,monospace}
  #gl{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;z-index:10;padding:14px 16px;
    background:rgba(6,6,7,.82);border-right:1px solid rgba(255,255,255,.12);
    border-bottom:1px solid rgba(255,255,255,.12);min-width:340px}
  h1{font-size:11px;letter-spacing:.16em;margin:0 0 10px;color:#fcff02}
  table{border-collapse:collapse;width:100%}
  td{padding:3px 8px 3px 0;white-space:nowrap}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:#8acf14}.bad{color:#ff6b4a}.warn{color:#e8b33a}
  .sw{display:inline-block;width:10px;height:10px;vertical-align:-1px;
    border:1px solid rgba(255,255,255,.3)}
  #note{margin-top:10px;color:#8b8f96;max-width:330px;line-height:1.5;white-space:normal}
</style></head><body>
<canvas id="gl"></canvas>
<div id="hud">
  <h1>ACCEPTANCE — L* MEASURED FROM FRAMEBUFFER</h1>
  <table id="t"></table>
  <div id="note">One link rotates 360&deg; continuously. Watch for a highlight
  that <b>travels</b> across its surface. A dot that stays put means the
  environment is still wrong.</div>
</div>

<script type="importmap">
{"imports":{"three":"/vendor/three-0.186.0.esm.min.js","three/addons/":"/vendor/three-addons/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { makeEnv }   from './gl/env.js';
import { makeStage } from './gl/stage.js';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false,
  preserveDrawingBuffer:true });            // needed to read pixels back
renderer.setPixelRatio(1);                  // 1:1 so pixel reads are exact
renderer.setSize(innerWidth, innerHeight,false);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.environment = makeEnv(renderer);

const stage = makeStage();
scene.add(stage.plate);

const key = new THREE.DirectionalLight('#ffffff', 1.6);
key.position.set(-3.4,5.2,3.0); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6});
key.shadow.bias=-0.0008; key.shadow.normalBias=0.02; key.shadow.radius=4;
scene.add(key);
scene.add(new THREE.HemisphereLight('#e9ecef','#0a0b0d',0.35));

// one link, isolated, rotating — the acceptance test
const linkMat = new THREE.MeshPhysicalMaterial({
  color:'#23272d', metalness:0.92, roughness:0.24, envMapIntensity:1.15,
});
const link = new THREE.Mesh(new THREE.TorusGeometry(0.62,0.16,10,28), linkMat);
link.scale.set(1,1.3,1); link.position.set(0,0.15,0); link.castShadow = true;
scene.add(link);

const cam = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 100);
cam.position.set(0.3,1.5,4.6); cam.lookAt(0,-0.2,0);

// ---- L* measurement -------------------------------------------------
const buf = new Uint8Array(4);
function srgbToLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function Lstar(r,g,b){
  const Y = 0.2126*srgbToLin(r)+0.7152*srgbToLin(g)+0.0722*srgbToLin(b);
  return Y>0.008856 ? 116*Math.cbrt(Y)-16 : 903.3*Y;
}
function sample(nx,ny){
  const x=Math.round(nx*renderer.domElement.width);
  const y=Math.round(ny*renderer.domElement.height); // readPixels origin is BOTTOM-left
  renderer.readRenderTargetPixels?0:0;
  const gl=renderer.getContext();
  gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,buf);
  return {L:Lstar(buf[0],buf[1],buf[2]),hex:'#'+[buf[0],buf[1],buf[2]].map(v=>v.toString(16).padStart(2,'0')).join('')};
}
// brightest pixel within a small window = specular peak
function peak(nx,ny,r){
  let best={L:-1,hex:'#000'};
  for(let i=-r;i<=r;i+=2) for(let j=-r;j<=r;j+=2){
    const s=sample(nx+i/renderer.domElement.width, ny+j/renderer.domElement.height);
    if(s.L>best.L) best=s;
  }
  return best;
}
// ny: 0 = bottom of frame, 1 = top. Coords matched to the real framing.
function peakMin(nx,ny,r){
  let best={L:999,hex:'#000'};
  for(let i=-r;i<=r;i+=3) for(let j=-r;j<=r;j+=3){
    const s=sample(nx+i/renderer.domElement.width, ny+j/renderer.domElement.height);
    if(s.L<best.L) best=s;
  }
  return best;
}
const TARGETS=[
  ['Plate centre',        86, 6,  ()=>sample(0.50,0.14)],
  ['Plate outer third',   60, 12, ()=>sample(0.13,0.10)],
  ['Link body silhouette',23, 5,  ()=>peakMin(0.57,0.68,30)],
  ['Link specular peak',  82, 8,  ()=>peak(0.57,0.68,44)],
  ['Page ground',        3.5, 3,  ()=>sample(0.94,0.94)],
];
const t=document.getElementById('t');
function readout(){
  t.innerHTML = TARGETS.map(([label,target,tol,fn])=>{
    const {L,hex}=fn();
    const d=Math.abs(L-target);
    const cls = d<=tol?'ok':(d<=tol*2?'warn':'bad');
    return `<tr><td><span class="sw" style="background:${hex}"></span> ${label}</td>
      <td class="n ${cls}">${L.toFixed(1)}</td>
      <td class="n" style="color:#5a5e65">/ ${target}</td>
      <td class="n ${cls}">${d<=tol?'PASS':'off '+d.toFixed(0)}</td></tr>`;
  }).join('');
}

let n=0;
function frame(ms){
  link.rotation.y = ms*0.0006;
  link.rotation.z = Math.sin(ms*0.0004)*0.35;
  stage.apply(0.5);
  renderer.render(scene,cam);
  if((n++ % 20)===0) readout();
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight,false);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
});
requestAnimationFrame(frame);
window.__dbg={scene,renderer,link,stage,sample,peak,Lstar};
</script></body></html>
