<!DOCTYPE html><meta charset="utf-8"><title>stack test</title>
<body style="background:#060607;color:#8acf14;font:13px ui-monospace,Menlo,monospace;padding:20px">
<pre id="o">testing…</pre>
<div style="height:300vh"></div>
<script type="importmap">
{"imports":{
 "three":"/vendor/three-0.186.0.esm.min.js",
 "three/addons/":"/vendor/three-addons/",
 "gsap":"/vendor/gsap-3.13.0.esm.js",
 "gsap/ScrollTrigger":"/vendor/gsap-scrolltrigger-3.13.0.esm.js",
 "lenis":"/vendor/lenis-1.3.11.esm.js"
}}
</script>
<script type="module">
const log=[];const p=(k,v)=>{log.push(`${k.padEnd(30)} ${v}`);document.getElementById('o').textContent=log.join('\n');};
try{
  const THREE=await import('three'); p('three',THREE.REVISION);
  const {HDRLoader}=await import('three/addons/loaders/HDRLoader.js'); p('HDRLoader',typeof HDRLoader);
  const gsapMod=await import('gsap');
  const gsap=gsapMod.gsap||gsapMod.default; p('gsap',gsap.version);
  window.gsap=gsap;                                   // ScrollTrigger looks for it here
  const stMod=await import('gsap/ScrollTrigger');
  const ScrollTrigger=stMod.ScrollTrigger||stMod.default; p('ScrollTrigger',typeof ScrollTrigger);
  gsap.registerPlugin(ScrollTrigger); p('registerPlugin','ok');
  p('ST sees same gsap', ScrollTrigger.version===gsap.version ? 'yes '+ScrollTrigger.version : 'MISMATCH');
  const LenisMod=await import('lenis');
  const Lenis=LenisMod.default||LenisMod.Lenis; p('Lenis',typeof Lenis);
  const lenis=new Lenis({autoRaf:false,duration:1.5,lerp:0.075});
  gsap.ticker.add(t=>lenis.raf(t*1000)); gsap.ticker.lagSmoothing(0);
  lenis.on('scroll',ScrollTrigger.update); p('lenis+gsap bridge','wired');
  // prove a scrub trigger actually fires
  let fired=0;
  gsap.timeline({scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:true,
    onUpdate:()=>fired++}}).to({v:0},{v:1});
  setTimeout(()=>{scrollTo(0,600);setTimeout(()=>p('scrub onUpdate fires',fired>0?'YES ('+fired+')':'NO'),400);},300);
  // HDR loads?
  new HDRLoader().load('/vendor/hdri/empty_warehouse_01_1k.hdr',
    t=>p('HDRI',`loaded ${t.image.width}x${t.image.height}`), undefined, e=>p('HDRI','FAIL '+e));
}catch(e){p('FATAL',e.message);}
</script>
